<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JTBS Classic</title>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#000000"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#FFD700;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;}
#wm-yours, #live-badge { display: none !important; }

/* ── PLAYER ── */
#player-wrap{position:fixed;inset:0;background:#000;}
#video-el{width:100%;height:100%;object-fit:contain;display:block;background:#000;pointer-events:none;}
#video-el.hidden{display:none;}
#iframe-el{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;}
#iframe-el.active{display:block;}

/* ── OFF AIR ── */
#offair-screen{
  position:absolute;inset:0;
  background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:6;opacity:0;pointer-events:none;transition:opacity .6s;
}
#offair-screen.visible{opacity:1;pointer-events:auto;}
#offair-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.3;}
.offair-content{position:relative;z-index:2;text-align:center;}
.offair-icon{font-size:48px;margin-bottom:12px;opacity:.7;}
.offair-title{font-size:clamp(22px,3.5vw,38px);font-weight:800;color:var(--gold);letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 20px rgba(255,215,0,.4);}
.offair-sub{font-size:clamp(12px,1.4vw,15px);color:rgba(255,255,255,.5);letter-spacing:1px;margin-top:8px;}

/* ── TOP-LEFT: logo + channel name ── */
#wm-yours{
  position:fixed;top:18px;left:22px;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  z-index:20;pointer-events:none;
  animation:fadein 2s ease forwards;
}
#channel-logo{
  width:clamp(50px,7vw,80px);height:clamp(50px,7vw,80px);
  object-fit:contain;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.8));
}
.channel-name{
  font-size:clamp(13px,2vw,22px);font-weight:800;
  color:var(--gold);letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 0 14px rgba(255,180,0,.7),2px 2px 4px rgba(0,0,0,.9);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

@media (orientation: portrait) {
  body.live-state #wm-yours {
    top: calc(50vh - 28.125vw + 12px) !important;
    top: calc(50svh - 28.125vw + 12px) !important;
    left: 12px !important;
  }
  body.live-state #live-badge {
    top: calc(50vh - 28.125vw + 12px) !important;
    top: calc(50svh - 28.125vw + 12px) !important;
    right: 12px !important;
  }
}

/* ── TOP-RIGHT: live badge ── */
#live-badge{
  position:fixed;top:22px;right:22px;
  display:none;align-items:center;gap:7px;
  background:rgba(255,30,30,.15);border:1px solid rgba(255,50,50,.45);
  border-radius:20px;padding:6px 14px;z-index:20;pointer-events:none;
}
#live-badge.show{display:flex;}
#live-dot{width:9px;height:9px;background:#ff3333;border-radius:50%;box-shadow:0 0 8px #ff0000;animation:pulse 1.3s infinite;}
#live-label{font-size:12px;font-weight:700;color:#fff;letter-spacing:2px;font-family:'Courier New',monospace;}

/* ── BOTTOM-RIGHT: date + clock ── */
#clock-wrap{
  position:fixed;bottom:18px;right:76px;
  display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  z-index:20;pointer-events:none;
}
#clock-date{font-size:clamp(9px,1.1vw,12px);color:rgba(255,255,255,.5);letter-spacing:1px;font-family:'Courier New',monospace;}
#clock-time{font-size:clamp(11px,1.4vw,16px);color:rgba(255,255,255,.65);letter-spacing:1.5px;font-family:'Courier New',monospace;}

/* ── UNMUTE HINT REMOVED ── */

/* ── CORNER FRAMES (live only) ── */
#live-overlay{position:absolute;inset:0;pointer-events:none;z-index:7;}
.cg{position:absolute;width:32px;height:32px;opacity:.3;}
.cg.tl{top:10px;left:10px;border-top:2px solid var(--gold);border-left:2px solid var(--gold);}
.cg.tr{top:10px;right:10px;border-top:2px solid var(--gold);border-right:2px solid var(--gold);}
.cg.bl{bottom:10px;left:10px;border-bottom:2px solid var(--gold);border-left:2px solid var(--gold);}
.cg.br{bottom:10px;right:10px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold);}

@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:.5;}}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}

/* Announcement Banner Styles */
#offair-announcement {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 600px;
  z-index: 10;
  display: none;
  align-items: center;
  gap: 12px;
  border-radius: 12px;
  padding: 12px 20px;
  border: 1px solid transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  box-sizing: border-box;
  animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
#offair-announcement.show {
  display: flex;
}
#offair-announcement.gold {
  background: rgba(255, 215, 0, 0.12);
  border-color: rgba(255, 215, 0, 0.35);
  color: #ffd700;
  box-shadow: 0 4px 20px rgba(255, 215, 0, 0.15);
}
#offair-announcement.red {
  background: rgba(255, 50, 50, 0.12);
  border-color: rgba(255, 50, 50, 0.35);
  color: #ff6666;
  box-shadow: 0 4px 20px rgba(255, 50, 50, 0.15);
}
#offair-announcement.blue {
  background: rgba(30, 144, 255, 0.12);
  border-color: rgba(30, 144, 255, 0.35);
  color: #33a3ff;
  box-shadow: 0 4px 20px rgba(30, 144, 255, 0.15);
}
#offair-announcement.green {
  background: rgba(50, 205, 50, 0.12);
  border-color: rgba(50, 205, 50, 0.35);
  color: #4ee44e;
  box-shadow: 0 4px 20px rgba(50, 205, 50, 0.15);
}
#offair-announcement.purple {
  background: rgba(186, 85, 211, 0.12);
  border-color: rgba(186, 85, 211, 0.35);
  color: #c97deb;
  box-shadow: 0 4px 20px rgba(186, 85, 211, 0.15);
}
.announcement-icon {
  font-size: 20px;
  animation: announcePulse 1.5s infinite alternate;
}
.announcement-text {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  line-height: 1.4;
}
@keyframes slideDown {
  from { transform: translate(-50%, -20px); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}
@keyframes announcePulse {
  from { transform: scale(1); filter: drop-shadow(0 0 2px currentColor); }
  to { transform: scale(1.15); filter: drop-shadow(0 0 8px currentColor); }
}

/* ── FULLSCREEN BUTTON ── */
#fullscreen-btn {
  position: fixed;
  bottom: 18px;
  right: 22px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 215, 0, 0.4);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  transition: background 0.3s, border-color 0.3s, transform 0.2s;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
  pointer-events: auto;
}
#fullscreen-btn:hover {
  background: rgba(255, 215, 0, 0.15);
  border-color: var(--gold);
  transform: scale(1.05);
}
#fullscreen-btn:active {
  transform: scale(0.95);
}

/* App Download Popup styles */
#app-download-popup {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 320px;
  background: rgba(19, 19, 26, 0.95);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 20px;
  z-index: 1000;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  transition: transform 0.3s ease, opacity 0.3s ease;
  transform: translateY(150px);
  opacity: 0;
  pointer-events: none;
}
#app-download-popup.show {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.app-download-close {
  position: absolute;
  top: 10px;
  right: 12px;
  background: transparent;
  border: none;
  color: rgba(255, 255, 255, 0.6);
  font-size: 18px;
  cursor: pointer;
  line-height: 1;
}
.app-download-close:hover {
  color: #fff;
}
.app-download-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.app-download-desc {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  line-height: 1.5;
  margin-bottom: 14px;
}
.app-download-btn {
  display: block;
  width: 100%;
  padding: 10px;
  box-sizing: border-box;
  background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
  color: #000;
  text-align: center;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 700;
  font-size: 13px;
  transition: opacity 0.2s;
}
.app-download-btn:hover {
  opacity: 0.9;
}
#wm-yours, #live-badge, #clock-wrap, #fullscreen-btn, #live-overlay, #app-download-popup {
  display: none !important;
}
</style>
</head>

<script>
const FIREBASE_CONFIG={
  apiKey:"AIzaSyAA4izkWkMyHdrJ56HNoQcVBX_hJO8EH3s",

};
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();
const $=id=>document.getElementById(id);

const urlParams = new URLSearchParams(window.location.search);
const isPreview = urlParams.get('preview') === 'true';

// ── YOUTUBE API LOAD ─────────────────────────────────────────
let ytAPIReady = false;
let ytPlayer = null;
let ytInitQueue = null;

function extractYTPlaylistId(url) {
  if (!url) return null;
  const m = url.match(/[?&]list=([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}
function extractYTId(url) {
  if (!url) return null;
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

if (!window.YT) {
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
}

window.onYouTubeIframeAPIReady = function() {
  ytAPIReady = true;
  if (ytInitQueue) {
    playYouTube(ytInitQueue.videoId, ytInitQueue.playlistId, ytInitQueue.startSeconds);
    ytInitQueue = null;
  }
};

function initYouTubePlayer(videoId, playlistId, startSeconds) {
  if (window.YT && window.YT.Player) {
    playYouTube(videoId, playlistId, startSeconds);
  } else {
    ytInitQueue = { videoId, playlistId, startSeconds };
  }
}

// ── CLOCK ────────────────────────────────────────────────────
function updateClock(){
  const now=new Date();
  $('clock-date').textContent=now.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  $('clock-time').textContent=now.toLocaleTimeString('en-IN',{hour12:false});
}
setInterval(updateClock,1000);
updateClock();

// ── PLAYER ───────────────────────────────────────────────────
let state=null,hls=null,streamData={},configData={},cfgLoaded=false,stLoaded=false;
window.isUnmuted = true;
let currentPlayingUrl = null;
let currentPlayingType = null;
let currentPlaylistVideos = '';

function detectType(url){
  if(!url)return'';
  const u=url.toLowerCase();
  if(u.includes('youtube.com')||u.includes('youtu.be'))return'youtube';
  if(u.includes('facebook.com')||u.includes('fb.watch'))return'facebook';
  if(u.includes('.m3u8'))return'hls';
  return'iframe';
}

function stopPlayer(){
  currentPlayingUrl = null;
  currentPlayingType = null;
  currentPlaylistVideos = '';
  if(hls){hls.destroy();hls=null;}
  if(ytPlayer){
    try{ytPlayer.destroy();}catch(e){}
    ytPlayer=null;
  }
  
  // Recreate the placeholder div
  const container = $('iframe-container');
  const oldPlaceholder = $('yt-placeholder');
  if (oldPlaceholder) {
    container.removeChild(oldPlaceholder);
  }
  const newPlaceholder = document.createElement('div');
  newPlaceholder.id = 'yt-placeholder';
  container.insertBefore(newPlaceholder, $('iframe-el'));

  $('iframe-overlay').style.display = 'none';
  $('iframe-el').style.display = 'none';
  $('iframe-el').src = 'about:blank';
  container.style.display = 'none';
  $('video-el').pause();$('video-el').src='';
  $('video-el').classList.remove('hidden');
}

function playYouTube(videoId, playlistId, startSeconds) {
  $('iframe-container').style.display = 'block';
  $('iframe-overlay').style.display = 'block';
  
  const playerVars = {
    autoplay: 1,
    mute: 0,
    controls: 0,
    disablekb: 1,
    fs: 0,
    modestbranding: 1,
    rel: 0,
    iv_load_policy: 3,
    origin: window.location.origin
  };

  const hasCustomPlaylist = streamData.selectedVideos && streamData.selectedVideos.length > 0 && streamData.videoDurations && streamData.videoDurations.length > 0;
  let customVideoId = videoId;
  let customOffsetSeconds = 0;
  let customPlaylistArray = [];

  if (hasCustomPlaylist) {
    const updatedAtMs = streamData.updatedAt ? (streamData.updatedAt.toMillis ? streamData.updatedAt.toMillis() : new Date(streamData.updatedAt).getTime()) : Date.now();
    const elapsed = Math.max(0, (Date.now() - updatedAtMs) / 1000);
    const mode = streamData.playMode || 'offair';
    const totalD = streamData.videoDurations.reduce((a, b) => a + b, 0);

    if (mode === 'offair' && elapsed >= totalD) {
      setTimeout(() => { showOffAir(); }, 100);
      return;
    }

    if (mode === 'repeat' && elapsed >= totalD) {
      triggerRepeatTransition();
      return;
    }

    const loopElapsed = mode === 'loop' ? (elapsed % totalD) : elapsed;
    let accumulatedTime = 0;
    let currentIndex = 0;
    const durations = streamData.videoDurations;
    const videos = streamData.selectedVideos;

    for (let i = 0; i < durations.length; i++) {
      const d = durations[i];
      if (loopElapsed < accumulatedTime + d) {
        currentIndex = i;
        customOffsetSeconds = Math.floor(loopElapsed - accumulatedTime);
        break;
      }
      accumulatedTime += d;
    }

    customPlaylistArray = videos.slice(currentIndex).concat(videos.slice(0, currentIndex));
    customVideoId = customPlaylistArray[0];
  }

  const options = {
    height: '100%',
    width: '100%',
    playerVars: playerVars,
    events: {
      onReady: (event) => {
        event.target.playVideo();
        if (window.isUnmuted) {
          event.target.unMute();
          event.target.setVolume(100);
          
          setTimeout(() => {
            if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
              const state = ytPlayer.getPlayerState();
              if (state !== 1 && state !== 3) {
                console.log("YouTube unmuted autoplay blocked, falling back to muted play");
                window.isUnmuted = false;
                ytPlayer.mute();
                ytPlayer.playVideo();
              }
            }
          }, 2000);
        }
      },
      onStateChange: (event) => {
        if (event.data === YT.PlayerState.PLAYING) {
          if (window.isUnmuted) {
            if (typeof event.target.isMuted === 'function' && event.target.isMuted()) {
              event.target.unMute();
              event.target.setVolume(100);
            }
          } else {
            if (typeof event.target.isMuted === 'function' && !event.target.isMuted()) {
              console.log("YouTube player unmuted by user action!");
              window.isUnmuted = true;
            }
          }
        } else if (event.data === YT.PlayerState.CUED) {
          console.log("YouTube player cued. Forcing play...");
          event.target.playVideo();
        }

        if (event.data === YT.PlayerState.ENDED) {
          const mode = streamData.playMode || 'offair';
          if (mode === 'live') {
            console.log("YouTube live stream ended. Setting stream state to offline.");
            db.doc('streamState/main').update({
              isLive: false,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(err => console.error("Failed to set live stream offline:", err));
            return;
          }
          if (hasCustomPlaylist) {
            const currentPlaylist = typeof event.target.getPlaylist === 'function' ? event.target.getPlaylist() : null;
            const currentIndex = typeof event.target.getPlaylistIndex === 'function' ? event.target.getPlaylistIndex() : -1;
            
            if (currentPlaylist && currentIndex !== -1 && currentIndex === currentPlaylist.length - 1) {
              if (mode === 'repeat') {
                triggerRepeatTransition();
              } else if (mode === 'loop') {
                console.log("Custom playlist ended, looping selected videos...");
                event.target.loadPlaylist(streamData.selectedVideos, 0, 0);
              } else {
                showOffAir();
              }
            }
          } else if (playlistId) {
            if (mode === 'repeat') {
              triggerRepeatTransition();
            } else if (mode === 'loop') {
              event.target.playVideoAt(0);
            } else {
              showOffAir();
            }
          } else {
            if (mode === 'loop' || mode === 'repeat') {
              if (mode === 'repeat') {
                triggerRepeatTransition();
              } else {
                event.target.seekTo(0);
                event.target.playVideo();
              }
            } else {
              showOffAir();
            }
          }
        }
      }
    }
  };

  if (hasCustomPlaylist) {
    options.videoId = customVideoId;
    playerVars.playlist = customPlaylistArray.join(',');
    playerVars.start = customOffsetSeconds;
    const mode = streamData.playMode || 'offair';
    if (mode === 'loop') {
      playerVars.loop = 1;
    }
  } else {
    if (playlistId) {
      options.videoId = 'videoseries';
      playerVars.listType = 'playlist';
      playerVars.list = playlistId;
      const mode = streamData.playMode || 'offair';
      if (mode === 'repeat' || mode === 'loop') {
        playerVars.loop = 1;
        playerVars.playlist = playlistId;
      }
    } else if (videoId) {
      options.videoId = videoId;
      playerVars.start = startSeconds || 0;
      const mode = streamData.playMode || 'offair';
      if (mode === 'loop' || mode === 'repeat') {
        playerVars.loop = 1;
        playerVars.playlist = videoId;
      }
    }
  }

  ytPlayer = new YT.Player('yt-placeholder', options);
}



function startPlayer(url,typeHint,startSeconds){
  if(!url)return;
  const type=typeHint||detectType(url);
  const playlistVideosStr = streamData.selectedVideos ? JSON.stringify(streamData.selectedVideos) : '';
  
  if (url === currentPlayingUrl && type === currentPlayingType && playlistVideosStr === currentPlaylistVideos) {
    if (type === 'hls') {
      const video = $('video-el');
      if (video && video.paused) {
        video.play().catch(()=>{});
      }
    } else if (type === 'youtube' && ytPlayer && typeof ytPlayer.playVideo === 'function') {
      try {
        if (ytPlayer.getPlayerState() !== 1) {
          ytPlayer.playVideo();
        }
      } catch(e){}
    }
    return;
  }
  
  // YouTube to YouTube transition reuse
  if (type === 'youtube' && currentPlayingType === 'youtube' && ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
    try {
      const playlistId = extractYTPlaylistId(url);
      const videoId = extractYTId(url);
      const hasCustomPlaylist = streamData.selectedVideos && streamData.selectedVideos.length > 0 && streamData.videoDurations && streamData.videoDurations.length > 0;
      
      currentPlayingUrl = url;
      currentPlaylistVideos = playlistVideosStr;
      
      if (hasCustomPlaylist) {
        const updatedAtMs = streamData.updatedAt ? (streamData.updatedAt.toMillis ? streamData.updatedAt.toMillis() : new Date(streamData.updatedAt).getTime()) : Date.now();
        const elapsed = Math.max(0, (Date.now() - updatedAtMs) / 1000);
        const mode = streamData.playMode || 'offair';
        const totalD = streamData.videoDurations.reduce((a, b) => a + b, 0);

        if (mode === 'repeat' && elapsed >= totalD) {
          triggerRepeatTransition();
          return;
        } else {
          const loopElapsed = mode === 'loop' ? (elapsed % totalD) : elapsed;
          if (mode === 'offair' && elapsed >= totalD) {
            showOffAir();
            return;
          }

          let accumulatedTime = 0;
          let currentIndex = 0;
          let offsetSeconds = 0;
          const durations = streamData.videoDurations;
          const videos = streamData.selectedVideos;

          for (let i = 0; i < durations.length; i++) {
            const d = durations[i];
            if (loopElapsed < accumulatedTime + d) {
              currentIndex = i;
              offsetSeconds = Math.floor(loopElapsed - accumulatedTime);
              break;
            }
            accumulatedTime += d;
          }

          const rotatedPlaylist = videos.slice(currentIndex).concat(videos.slice(0, currentIndex));
          ytPlayer.loadPlaylist(rotatedPlaylist, 0, offsetSeconds);
          if (mode === 'loop') {
            ytPlayer.setLoop(true);
          } else {
            ytPlayer.setLoop(false);
          }
        }
      } else if (playlistId) {
        ytPlayer.loadPlaylist(playlistId, 0, startSeconds || 0);
        const mode = streamData.playMode || 'offair';
        if (mode === 'repeat') {
          ytPlayer.setLoop(true);
        }
      } else if (videoId) {
        ytPlayer.loadVideoById(videoId, startSeconds || 0);
        const mode = streamData.playMode || 'offair';
        if (mode === 'loop') {
          ytPlayer.setLoop(true);
        }
      }
      
      if (window.isUnmuted) {
        try {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
        } catch (e) {}
      } else {
        try {
          ytPlayer.mute();
        } catch (e) {}
      }
      try {
        ytPlayer.playVideo();
      } catch (e) {}
      
      return; // Success! Return early.
    } catch (e) {
      console.warn("YouTube transition reuse failed, falling back to full recreation:", e);
      // Fall through to full recreation
    }
  }

  stopPlayer();
  currentPlayingUrl = url;
  currentPlayingType = type;
  currentPlaylistVideos = playlistVideosStr;

  if(type==='hls'){
    $('video-el').classList.remove('hidden');$('iframe-container').style.display = 'none';
    if(Hls.isSupported()){
      hls=new Hls({lowLatencyMode:true,backBufferLength:30});
      hls.loadSource(url);hls.attachMedia($('video-el'));
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{
        const video = $('video-el');
        video.muted = !window.isUnmuted;
        video.play().catch((err)=>{
          if (err.name === 'NotAllowedError') {
            console.log("Unmuted autoplay blocked, falling back to muted HLS");
            video.muted = true;
            window.isUnmuted = false;
            video.play().catch(()=>{});
          }
        });
      });
      hls.on(Hls.Events.ERROR,(e,d)=>{
        if(d.fatal) {
          console.warn("HLS fatal error. Stopping and restarting player in 5s...");
          stopPlayer();
          setTimeout(()=>startPlayer(url,type),5000);
        }
      });
    } else if($('video-el').canPlayType('application/vnd.apple.mpegurl')){
      const video = $('video-el');
      video.src=url;
      video.muted = !window.isUnmuted;
      video.play().catch((err)=>{
        if (err.name === 'NotAllowedError') {
          console.log("Unmuted autoplay blocked, falling back to muted HLS native");
          video.muted = true;
          window.isUnmuted = false;
          video.play().catch(()=>{});
        }
      });
    }
  } else if(type==='youtube'){
    $('video-el').classList.add('hidden');
    const hasCustomPlaylist = streamData.selectedVideos && streamData.selectedVideos.length > 0;
    const playlistId = extractYTPlaylistId(url);
    const videoId = extractYTId(url);
    if (hasCustomPlaylist || playlistId || videoId) {
      initYouTubePlayer(videoId, playlistId, startSeconds);
    } else {
      $('iframe-container').style.display = 'block';
      $('iframe-el').style.display = 'block';
      $('iframe-el').src=url;
    }
  } else if(type==='facebook'){
    $('video-el').classList.add('hidden');
    $('iframe-container').style.display = 'block';
    $('iframe-overlay').style.display = 'block';
    $('iframe-el').style.display = 'block';
    $('iframe-el').src=`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&autoplay=true`;
  } else {
    $('video-el').classList.add('hidden');
    $('iframe-container').style.display = 'block';
    $('iframe-overlay').style.display = 'block';
    $('iframe-el').style.display = 'block';
    $('iframe-el').src=url;
  }
}

function updateLiveBadge() {
  const badge = $('live-badge');
  const dot = $('live-dot');
  const label = $('live-label');
  if (!badge) return;

  const isLive = state === 'live';
  const isOffAir = state === 'offair';
  const isPreviewMode = (typeof isPreview !== 'undefined' && isPreview);
  const c = configData || {};

  if (isLive || isPreviewMode) {
    const badgeText = (c.liveBadgeText !== undefined && c.liveBadgeText !== null) ? String(c.liveBadgeText).trim() : 'LIVE';
    if (badgeText !== '') {
      if (label) label.textContent = badgeText;
      if (dot) dot.style.display = 'block';
      badge.style.display = 'flex';
      badge.classList.add('show');
    } else {
      if (label) label.textContent = '';
      if (dot) dot.style.display = 'none';
      badge.style.display = 'none';
      badge.classList.remove('show');
    }
  } else if (isOffAir) {
    if (label) label.textContent = 'OFF AIR';
    if (dot) dot.style.display = 'block';
    badge.style.display = 'flex';
    badge.classList.add('show');
  } else {
    badge.style.display = 'none';
    badge.classList.remove('show');
  }
}

let isTransitioning = false;
function triggerRepeatTransition() {
  if (isTransitioning) return;
  isTransitioning = true;
  console.log("Triggering repeat transition...");

  const isFullPlaylistActive = streamData.selectedVideos && streamData.allVideos && 
                               streamData.selectedVideos.length === streamData.allVideos.length;

  if (!isFullPlaylistActive && streamData.allVideos && streamData.allVideos.length > 0) {
    console.log("Transitioning to full playlist...");
    db.doc('streamState/main').update({
      selectedVideos: streamData.allVideos,
      videoDurations: streamData.allDurations,
      duration: streamData.allDurations.reduce((a, b) => a + b, 0),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      console.log("Firestore updated to full playlist.");
      isTransitioning = false;
    }).catch(err => {
      console.error("Failed to update streamState to full playlist:", err);
      isTransitioning = false;
    });
  } else {
    console.log("Repeating playlist from beginning...");
    const updateData = {};
    if (window.streamMode === 'different') {
      updateData.decoderUpdatedAt = firebase.firestore.FieldValue.serverTimestamp();
    } else {
      updateData.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    }
    db.doc('streamState/main').update(updateData).then(() => {
      console.log("Firestore updatedAt reset.");
      isTransitioning = false;
    }).catch(err => {
      console.error("Failed to reset updatedAt:", err);
      isTransitioning = false;
    });
  }
}

function tryRender(){
  if(!cfgLoaded||!stLoaded)return;
  applyBranding(configData);

  let isLiveNow = streamData.isLive && streamData.streamUrl;
  let startSeconds = 0;

  if (isLiveNow && streamData.streamType === 'youtube') {
    let elapsed = 0;
    if (streamData.updatedAt) {
      try {
        const millis = streamData.updatedAt.toMillis ? streamData.updatedAt.toMillis() : new Date(streamData.updatedAt).getTime();
        if (millis) {
          elapsed = Math.max(0, (Date.now() - millis) / 1000);
        }
      } catch (err) {
        console.warn("Error parsing updatedAt timestamp:", err);
      }
    }
    const mode = streamData.playMode || 'offair';
    
    if (streamData.selectedVideos && streamData.selectedVideos.length > 0 && streamData.videoDurations && streamData.videoDurations.length > 0) {
      const totalPlaylistDuration = streamData.videoDurations.reduce((a, b) => a + b, 0);
      if (mode === 'offair') {
        if (elapsed > totalPlaylistDuration) {
          isLiveNow = false;
        } else {
          isLiveNow = true;
          startSeconds = 0;
        }
      } else if (mode === 'repeat') {
        if (elapsed >= totalPlaylistDuration) {
          triggerRepeatTransition();
          return;
        } else {
          isLiveNow = true;
          startSeconds = 0;
        }
      } else {
        isLiveNow = true;
        startSeconds = 0;
      }
    } else {
      const isPlaylist = /[?&]list=([A-Za-z0-9_-]+)/.test(streamData.streamUrl);
      if (isPlaylist) {
        isLiveNow = true;
        startSeconds = 0;
      } else {
        if (streamData.duration) {
          if (mode === 'loop') {
            isLiveNow = true;
            startSeconds = Math.floor(elapsed % streamData.duration);
          } else {
            if (elapsed > streamData.duration) {
              isLiveNow = false;
            } else {
              startSeconds = Math.floor(elapsed);
            }
          }
        } else {
          isLiveNow = true;
          startSeconds = 0;
        }
      }
    }
  }

  if(isLiveNow){
    document.body.classList.add('live-state');
    $('wm-yours').style.display = 'flex';
    showLive(startSeconds);
  } else {
    document.body.classList.remove('live-state');
    if (configData.showLogoOffAir) {
      $('wm-yours').style.display = 'flex';
    } else {
      $('wm-yours').style.display = 'none';
    }
    showOffAir();
  }
}

// Draggable logo and live badge in preview mode
function makeDraggable(el, topKey, leftKey, draggingFlagName) {
  el.style.pointerEvents = 'auto';
  el.style.cursor = 'move';

  let currentX = 0;
  let currentY = 0;
  let initialX = 0;
  let initialY = 0;
  let xOffset = 0;
  let yOffset = 0;
  let isDragging = false;

  el.addEventListener('mousedown', dragStart);
  document.addEventListener('mousemove', drag);
  document.addEventListener('mouseup', dragEnd);

  el.addEventListener('touchstart', dragStart, {passive: false});
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('touchend', dragEnd);

  function dragStart(e) {
    if (e.type === 'touchstart') {
      initialX = e.touches[0].clientX - xOffset;
      initialY = e.touches[0].clientY - yOffset;
    } else {
      initialX = e.clientX - xOffset;
      initialY = e.clientY - yOffset;
    }
    
    if (e.target === el || el.contains(e.target)) {
      isDragging = true;
      window[draggingFlagName] = true;
    }
  }

  function drag(e) {
    if (isDragging) {
      e.preventDefault();
      if (e.type === 'touchmove') {
        currentX = e.touches[0].clientX - initialX;
        currentY = e.touches[0].clientY - initialY;
      } else {
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;
      }
      xOffset = currentX;
      yOffset = currentY;
      el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
    }
  }

  function dragEnd(e) {
    if (isDragging) {
      initialX = currentX;
      initialY = currentY;
      isDragging = false;
      window[draggingFlagName] = false;

      const rect = el.getBoundingClientRect();
      const topPct = (rect.top / window.innerHeight) * 100;
      const leftPct = (rect.left / window.innerWidth) * 100;

      // Reset local offsets since applyBranding will reset translation to none
      xOffset = 0;
      yOffset = 0;
      currentX = 0;
      currentY = 0;

      db.doc('config/main').set({
        [topKey]: topPct,
        [leftKey]: leftPct
      }, {merge: true}).then(() => {
        console.log(`${el.id} position saved:`, topPct, leftPct);
      }).catch(err => {
        console.error(`Error saving position for ${el.id}:`, err);
      });
    }
  }
}

if (isPreview) {
  const wm = $('wm-yours');
  if (wm) makeDraggable(wm, 'logoTop', 'logoLeft', 'logoDragging');

  const badge = $('live-badge');
  if (badge) makeDraggable(badge, 'badgeTop', 'badgeLeft', 'badgeDragging');
}

db.doc('config/main').onSnapshot(snap=>{configData=snap.exists?snap.data():{};cfgLoaded=true;applyBranding(configData);tryRender();},()=>{cfgLoaded=true;tryRender();});
db.doc('streamState/main').onSnapshot(snap=>{
  const data = snap.exists ? snap.data() : { isLive: false };
  const mode = data.mode || 'same';
  window.streamMode = mode;
  
  if (mode === 'different') {
    streamData = {
      isLive: data.decoderIsLive || false,
      streamUrl: data.decoderStreamUrl || '',
      streamType: data.decoderStreamType || '',
      playMode: data.decoderPlayMode || 'live',
      duration: data.decoderDuration || 0,
      updatedAt: data.decoderUpdatedAt || null
    };
  } else {
    streamData = data;
  }
  
  stLoaded = true;
  tryRender();
},()=>{stLoaded=true;tryRender();});
let announcementData = {};
db.doc('announcement/current').onSnapshot(snap => {
  announcementData = snap.exists ? snap.data() : {};
  if (typeof updateAnnouncementUI === 'function') updateAnnouncementUI();
});

function updateAnnouncementUI() {
  const banner = $('offair-announcement');
  const textEl = $('announcement-text-el');
  if (!banner || !textEl) return;

  const isOffAir = state === 'offair';
  
  if (isOffAir && announcementData.active && announcementData.text) {
    textEl.textContent = announcementData.text;
    banner.classList.remove('gold', 'red', 'blue', 'green', 'purple');
    banner.classList.add(announcementData.color || 'gold');
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}
setInterval(()=>{
  if(state==='live'&&!$('iframe-el').classList.contains('active')&&!$('video-el').paused&&$('video-el').readyState<2) {
    console.warn("Watchdog: stream stalled. Forcing restart...");
    stopPlayer();
    startPlayer(streamData.streamUrl,streamData.streamType);
  }
},15000);

// ── FULLSCREEN TOGGLE ────────────────────────────────────────
function toggleFullscreen() {
  const docEl = document.documentElement;
  const video = $('video-el');
  
  if (!document.fullscreenElement && 
      !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(()=>{});
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen().catch(()=>{});
    } else if (docEl.mozRequestFullScreen) {
      docEl.mozRequestFullScreen().catch(()=>{});
    } else if (docEl.msRequestFullscreen) {
      docEl.msRequestFullscreen().catch(()=>{});
    } else if (video && video.webkitEnterFullscreen) {
      try { video.webkitEnterFullscreen(); } catch(e) {}
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(()=>{});
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen().catch(()=>{});
    } else if (document.mozCancelFullScreen) {
      document.mozCancelFullScreen().catch(()=>{});
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen().catch(()=>{});
    }
  }
}

function onFullscreenChange() {
  const fsBtn = $('fullscreen-btn');
  if (!fsBtn) return;
  const isFS = document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
  if (isFS) {
    fsBtn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"/></svg>`;
  } else {
    fsBtn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>`;
  }
}

const fsBtn = $('fullscreen-btn');
if (fsBtn) {
  fsBtn.addEventListener('click', toggleFullscreen);
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
document.addEventListener('mozfullscreenchange', onFullscreenChange);
document.addEventListener('MSFullscreenChange', onFullscreenChange);

if (typeof isPreview !== 'undefined' && isPreview) {
  if (fsBtn) fsBtn.style.display = 'none';
  const clock = $('clock-wrap');
  if (clock) clock.style.right = '22px';
}

// ── VIEWER TRACKING & HEARTBEAT ──────────────────────────────
function getBrowserAndOS() {
  const ua = navigator.userAgent;
  let os = "Unknown OS";
  let device = "Web";
  let browser = "Unknown Browser";

  if (ua.includes('JTBS-Android-App')) {
    os = "Android";
    device = "App";
    browser = "App";
    return { os, device, browser };
  }

  if (/android/i.test(ua)) {
    os = "Android";
    device = "Android";
  } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
    os = "iOS";
    device = "iOS";
  } else if (/Windows/i.test(ua)) {
    os = "Windows";
    device = "Web";
  } else if (/Mac/i.test(ua)) {
    os = "macOS";
    device = "Web";
  } else if (/Linux/i.test(ua)) {
    os = "Linux";
    device = "Web";
  }

  if (/chrome|crios/i.test(ua) && !/edge|edg/i.test(ua) && !/opr/i.test(ua)) {
    browser = "Chrome";
  } else if (/safari/i.test(ua) && !/chrome|crios/i.test(ua)) {
    browser = "Safari";
  } else if (/firefox|fxios/i.test(ua)) {
    browser = "Firefox";
  } else if (/edge|edg/i.test(ua)) {
    browser = "Edge";
  } else if (/opr/i.test(ua)) {
    browser = "Opera";
  }

  return { os, device, browser };
}

const sessionID = 'sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
let viewerData = {
  id: sessionID,
  ip: 'Unknown',
  location: 'Unknown',
  os: 'Unknown OS',
  device: 'Web',
  browser: 'Unknown Browser',
  lastActive: firebase.firestore.FieldValue.serverTimestamp()
};

const clientInfo = getBrowserAndOS();
viewerData.os = clientInfo.os;
viewerData.device = clientInfo.device;
viewerData.browser = clientInfo.browser;

function updateViewerHeartbeat() {
  if (typeof isPreview !== 'undefined' && isPreview) return;
  viewerData.lastActive = firebase.firestore.FieldValue.serverTimestamp();
  db.collection('activeViewers').doc(sessionID).set(viewerData, { merge: true })
    .catch(err => console.error("Heartbeat error:", err));
}

fetch('https://ipapi.co/json/')
  .then(res => res.json())
  .then(data => {
    viewerData.ip = data.ip || 'Unknown';
    viewerData.location = (data.city && data.country_name) ? data.city + ", " + data.country_name : (data.country_name || 'Unknown');
    updateViewerHeartbeat();
  })
  .catch(() => {
    fetch('https://geolocation-db.com/json/')
      .then(res => res.json())
      .then(data => {
        viewerData.ip = data.IPv4 || 'Unknown';
        viewerData.location = (data.city && data.country_name) ? data.city + ", " + data.country_name : (data.country_name || 'Unknown');
        updateViewerHeartbeat();
      })
      .catch(() => {
        updateViewerHeartbeat();
      });
  });

setInterval(updateViewerHeartbeat, 15000);

window.addEventListener('beforeunload', () => {
  if (typeof isPreview !== 'undefined' && isPreview) return;
  db.collection('activeViewers').doc(sessionID).delete().catch(()=>{});
});
</script>
