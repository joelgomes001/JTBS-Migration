<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000;
    }
    #player {
      width: 100%; height: 100%; border: none;
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div id="player"></div>
  <script>
    let player = null;
    let apiReady = false;
    let pendingData = null;

    window.onYouTubeIframeAPIReady = function() {
      apiReady = true;
      if (pendingData) {
        updateStream(pendingData);
        pendingData = null;
      }
    };

    window.updateStream = function(jsonData) {
      if (!apiReady) {
        pendingData = jsonData;
        return;
      }

      const streamData = JSON.parse(jsonData);
      const url = streamData.streamUrl;
      const videoId = extractYTId(url);
      const playlistId = extractYTPlaylistId(url);

      const hasCustomPlaylist = streamData.selectedVideos && streamData.selectedVideos.length > 0 && streamData.videoDurations && streamData.videoDurations.length > 0;
      let targetVideoId = videoId;
      let startSeconds = 0;
      let playlistIds = [];

      const mode = streamData.playMode || 'offair';
      const now = Date.now();
      const updatedAtMs = streamData.updatedAtMs || now;
      const elapsed = Math.max(0, (now - updatedAtMs) / 1000);

      if (hasCustomPlaylist) {
        const totalD = streamData.videoDurations.reduce((a, b) => a + b, 0);

        if (mode === 'offair' && elapsed >= totalD) {
          stopPlayer();
          return;
        }

        const loopElapsed = mode === 'loop' ? (elapsed % totalD) : elapsed;
        if (mode === 'repeat' && elapsed >= totalD) {
          const elapsedRepeat = elapsed % totalD;
          let accumulatedTime = 0;
          let currentIndex = 0;
          for (let i = 0; i < streamData.videoDurations.length; i++) {
            const d = streamData.videoDurations[i];
            if (elapsedRepeat < accumulatedTime + d) {
              currentIndex = i;
              startSeconds = Math.floor(elapsedRepeat - accumulatedTime);
              break;
            }
            accumulatedTime += d;
          }
          playlistIds = streamData.selectedVideos.slice(currentIndex).concat(streamData.selectedVideos.slice(0, currentIndex));
          targetVideoId = playlistIds[0];
        } else {
          let accumulatedTime = 0;
          let currentIndex = 0;
          for (let i = 0; i < streamData.videoDurations.length; i++) {
            const d = streamData.videoDurations[i];
            if (loopElapsed < accumulatedTime + d) {
              currentIndex = i;
              startSeconds = Math.floor(loopElapsed - accumulatedTime);
              break;
            }
            accumulatedTime += d;
          }
          playlistIds = streamData.selectedVideos.slice(currentIndex).concat(streamData.selectedVideos.slice(0, currentIndex));
          targetVideoId = playlistIds[0];
        }
      } else if (playlistId) {
        playlistIds = [];
        targetVideoId = '';
        startSeconds = 0;
      } else if (videoId) {
        targetVideoId = videoId;
        if (streamData.duration && streamData.duration > 0) {
          if (mode === 'loop' || mode === 'repeat') {
            startSeconds = Math.floor(elapsed % streamData.duration);
          } else {
            if (elapsed >= streamData.duration) {
              stopPlayer();
              return;
            }
            startSeconds = Math.floor(elapsed);
          }
        } else {
          startSeconds = 0;
        }
      }

      const playerVars = {
        autoplay: 1,
        controls: 0,
        disablekb: 1,
        fs: 0,
        modestbranding: 1,
        rel: 0,
        iv_load_policy: 3,
        start: startSeconds
      };

      if (playlistIds.length > 0) {
        playerVars.playlist = playlistIds.join(',');
      } else if (playlistId) {
        playerVars.listType = 'playlist';
        playerVars.list = playlistId;
      }

      if (player) {
        try {
          if (playlistIds.length > 0) {
            player.loadPlaylist(playlistIds, 0, startSeconds);
          } else if (playlistId) {
            player.loadPlaylist({
              listType: 'playlist',
              list: playlistId,
              index: 0,
              startSeconds: startSeconds
            });
          } else {
            player.loadVideoById(targetVideoId, startSeconds);
          }
          player.unMute();
          player.playVideo();
        } catch (e) {
          recreatePlayer(targetVideoId, playerVars);
        }
      } else {
        recreatePlayer(targetVideoId, playerVars);
      }
    };

    function recreatePlayer(videoId, playerVars) {
      if (player) {
        try { player.destroy(); } catch (e) {}
      }
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: playerVars,
        events: {
          onReady: (e) => {
            e.target.unMute();
            e.target.playVideo();
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.CUED) {
              e.target.playVideo();
            }
            if (e.data === YT.PlayerState.PLAYING) {
              e.target.unMute();
            }
          }
        }
      });
    }

    function stopPlayer() {
      if (player) {
        try {
          player.stopVideo();
        } catch(e) {}
      }
    }

    function extractYTPlaylistId(url) {
      if (!url) return null;
      const m = url.match(/[?&]list=([A-Za-z0-9_-]+)/);
      return m ? m[1] : null;
    }

    function extractYTId(url) {
      if (!url) return null;
      const m = url.match(/(?:v=|youtu\.be\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }
  </script>
</body>
</html>
